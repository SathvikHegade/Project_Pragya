    <rect x="8" y="0" width="5" height="32" fill="url(#letterGradient)"/>
    <path d="M8 20 Q8 32 18 32 Q28 32 28 20 L28 14 L36 14 L36 8 L28 8 L28 4 L8 4 L8 14 L18 14 L18 20 Z" fill="url(#letterGradient)"/>
    <rect x="4" y="0" width="30" height="4" fill="url(#letterGradient)"/>
  </g>
  
  <!-- Tilted Electron Orbital -->
  <ellipse cx="46" cy="28" rx="12" ry="5" fill="none" stroke="#FFB347" stroke-width="1.5" transform="rotate(-30 46 28)"/>
  
  <!-- Electron dot -->
