<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
    <linearGradient id="underlineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
    <radialGradient id="electronGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFB347"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#110A00"/>
  
  <!-- Devanagari Letter 'प' - Bold geometric -->
  <g transform="translate(140, 120)">
    <!-- Vertical bar of प -->
    <rect x="60" y="0" width="35" height="180" fill="url(#letterGradient)"/>
    <!-- Curved bottom part -->
    <path d="M60 120 Q60 180 95 180 Q130 180 130 120 L130 90 L165 90 L165 70 L130 70 L130 45 L60 45 L60 90 L95 90 L95 120 Z" fill="url(#letterGradient)"/>
    <!-- Top horizontal bar -->
    <rect x="40" y="0" width="180" height="25" fill="url(#letterGradient)"/>
    <!-- Left extension -->
    <rect x="40" y="0" width="25" height="70" fill="url(#letterGradient)"/>
  </g>
  
  <!-- Tilted Electron Orbital Ellipse (integrated with letter) -->
  <ellipse cx="340" cy="200" rx="55" ry="22" fill="none" stroke="#FFB347" stroke-width="2" transform="rotate(-30 340 200)"/>
  
  <!-- Electron (glowing dot) -->
  <circle cx="385" cy="172" r="6" fill="#FFB347"/>
  <circle cx="385" cy="172" r="10" fill="url(#electronGlow)"/>
  
  <!-- 4-point Star Accent (top right) -->
  <path d="M400 80 L405 95 L420 100 L405 105 L400 120 L395 105 L380 100 L395 95 Z" fill="#FFB347"/>
  
  <!-- Teal Accent Dot (bottom left) -->
  <circle cx="100" cy="420" r="8" fill="#20B2AA"/>
  
  <!-- Wordmark "PRAGYA" -->
  <text x="256" y="430" font-family="Arial, sans-serif" font-size="36" font-weight="bold" letter-spacing="14" fill="url(#letterGradient)" text-anchor="middle">PRAGYA</text>
  
  <!-- Gradient Underline Bar -->
  <rect x="146" y="448" width="220" height="4" fill="url(#underlineGradient)" rx="2"/>
  
  <!-- Subtitle "VIRTUAL STEM LAB" -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="13" letter-spacing="4" fill="#FFB347" text-anchor="middle" font-weight="500">VIRTUAL STEM LAB</text>
</svg>