version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pragya-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-pragya-dev-secret-change-in-prod}
      - DATABASE_URL=${DATABASE_URL}   # your Supabase connection string, set in a local .env file
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pragya-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
