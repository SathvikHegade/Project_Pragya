<svg width="100" height="100" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#110A00"/>
  
  <!-- Orbital ring -->
  <ellipse cx="32" cy="24" rx="22" ry="8" fill="none" stroke="#FFB347" stroke-width="1.5" transform="rotate(-20 32 24)" opacity="0.95"/>
  
  <!-- Electron dot -->
  <circle cx="50" cy="15" r="2" fill="#FFB347"/>
  
  <!-- Devanagari letter प - centered in orbital -->
  <text x="32" y="36" font-family="'Noto Sans Devanagari', 'Arial Unicode MS', serif" font-size="30" font-weight="700" fill="url(#og1)" text-anchor="middle">प</text>
  
  <!-- 4-point star - top right -->
  <path d="M50 6 L51.5 8 L54 9 L51.5 10 L50 12 L48.5 10 L46 9 L48.5 8 Z" fill="#FF6B00"/>
  
  <!-- Small accent dot - bottom left (same as logo.svg) -->
  <circle cx="18" cy="44" r="1.5" fill="#FFB347" opacity="0.6"/>
</svg>