<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#110A00"/>
  
  <!-- Devanagari Letter 'प' - Simplified -->
  <g transform="translate(18, 15)">
    <rect x="10" y="0" width="6" height="48" fill="url(#letterGradient)"/>
    <path d="M10 28 Q10 48 22 48 Q34 48 34 28 L34 20 L44 20 L44 12 L34 12 L34 6 L10 6 L10 20 L22 20 L22 28 Z" fill="url(#letterGradient)"/>
    <rect x="4" y="0" width="44" height="6" fill="url(#letterGradient)"/>
  </g>
  
  <!-- Tilted Electron Orbital -->
  <ellipse cx="70" cy="42" rx="16" ry="6" fill="none" stroke="#FFB347" stroke-width="2" transform="rotate(-30 70 42)"/>
  
  <!-- Electron dot -->
  <circle cx="80" cy="32" r="3" fill="#FFB347"/>
  
  <!-- Star accent -->
  <path d="M78 12 L80 16 L84 18 L80 20 L78 24 L76 20 L72 18 L76 16 Z" fill="#FFB347"/>
  
  <!-- Teal dot -->
  <circle cx="20" cy="82" r="4" fill="#20B2AA"/>
</svg>